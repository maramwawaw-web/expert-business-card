<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acessar Painel | Expert Business Card</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="app-mode">

    <header class="app-header">
        <div class="header-container">
            <a href="index.html" class="app-brand">
                <img src="logo-ebc.svg" alt="EBC Logo" class="brand-logo">
            </a>
            <div class="header-actions">
                <a href="cadastro.html" class="btn btn-primary-glow">Criar Conta</a>
            </div>
        </div>
    </header>

    <main class="app-content">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header text-center">
                    <div class="app-chip">🔑 Área do Cliente</div>
                    <h2>Acessar Seu Dashboard</h2>
                    <p>Gerencie seus dados e atualize seu QR Code em tempo real.</p>
                </div>

                <form id="form-login" class="app-form" onsubmit="realizarLogin(event)">
                    
                    <div id="login-alert" class="form-alert" style="display: none;"></div>

                    <div class="form-group">
                        <label for="login-email">E-mail Cadastrado</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input type="email" id="login-email" placeholder="seuemail@dominio.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-senha">Sua Senha</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="login-senha" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-app-primary btn-full">
                        Entrar no Painel
                    </button>

                </form>

                <div class="auth-footer text-center">
                    <p>Ainda não tem um Business Card? <a href="cadastro.html" class="link-highlight">Cadastre-se aqui</a></p>
                </div>
            </div>
        </div>
    </main>

    <div class="mobile-bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Início</span>
        </a>
        <a href="planos.html" class="nav-item">
            <span class="nav-icon">💎</span>
            <span class="nav-label">Planos</span>
        </a>
        <a href="cadastro.html" class="nav-item">
            <span class="nav-icon">➕</span>
            <span class="nav-label">Criar</span>
        </a>
        <a href="login.html" class="nav-item active">
            <span class="nav-icon">🔑</span>
            <span class="nav-label">Entrar</span>
        </a>
    </div>

    <script src="app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
