<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expert Business Card | Proteja Seu Patrimônio Digital</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* Estilos dos Cards Modelos da Home */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }

        .public-card-pink {
            background: rgba(20, 10, 25, 0.95);
            border: 1px solid #ff007f;
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.25);
        }
        .avatar-pink {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #2a081a;
            padding: 4px;
            border: 2px solid #ff66c4;
            box-shadow: 0 0 15px rgba(255, 102, 196, 0.4);
        }
        .badge-pink {
            background: rgba(255, 0, 127, 0.15);
            color: #ff66c4;
            border: 1px solid rgba(255, 102, 196, 0.3);
        }
        .btn-pink {
            background: linear-gradient(135deg, #ff007f, #ff66c4);
            color: #fff;
        }

        .public-card-blue {
            background: rgba(10, 20, 35, 0.95);
            border: 1px solid #00d2ff;
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.25);
        }
        .avatar-blue {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #081d33;
            padding: 4px;
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .badge-blue {
            background: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .btn-blue {
            background: linear-gradient(135deg, #0052d4, #00d2ff);
            color: #fff;
        }
    </style>
</head>

    </header>
