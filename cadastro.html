        /* Ajustes específicos para a grade de cartões */
        .cards-grid-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 850px;
            margin: 0 auto 30px auto;
            width: 100%;
        }

        .custom-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            flex: 1;
            min-width: 290px;
            max-width: 380px;
            padding: 24px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .custom-card .avatar-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .custom-card .badge-verified {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .custom-card h3 {
            font-size: 1.35rem;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .custom-card .card-subtitle {
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .custom-card .card-bio {
            font-size: 0.82rem;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .custom-card .card-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .custom-card .btn-card-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .custom-card .btn-card-action:hover {
            opacity: 0.9;
        }

        .custom-card .social-links {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .custom-card .social-links a {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .custom-card .btn-register {
            width: 100%;
            padding: 8px;
            border: 2px solid;
            background: transparent;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
            display: block;
        }

        /* CARD HELOISA */
        .card-heloisa .avatar-box { background: #f3e5f5; color: #8e44ad; }
