<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Criar Conta | Expert Business Card</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="app-mode">

    <header class="app-header">
        <div class="header-container">
            <a href="index.html" class="app-brand">
                <img src="logo-ebc.svg" alt="EBC Logo" class="brand-logo">
            </a>
            <div class="header-actions">
                <a href="login.html" class="btn btn-ghost">Já tenho conta</a>
            </div>
        </div>
    </header>

    <main class="app-content">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header text-center">
                    <div class="app-chip">🚀 Proteja Seus Contatos</div>
                    <h2>Crie sua Conta EBC</h2>
                    <p>Preencha os dados abaixo para gerar seu cartão e painel exclusivo.</p>
                </div>

                <form id="form-cadastro" class="app-form" onsubmit="realizarCadastro(event)">
                    
                    <div id="auth-alert" class="form-alert" style="display: none;"></div>

                    <div class="form-group">
                        <label for="nome">Nome Completo / Empresa</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="nome" placeholder="Ex: Marcos Silva" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail Principal</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input type="email" id="email" placeholder="seuemail@dominio.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="whatsapp">WhatsApp Profissional</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📱</span>
                            <input type="tel" id="whatsapp" placeholder="(42) 99915-7587" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="senha">Crie uma Senha Segura</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="plano">Plano Escolhido</label>
                        <div class="input-wrapper">
                            <span class="input-icon">💎</span>
                            <select id="plano">
                                <option value="Start">Plano Start - R$ 19,90 (Único)</option>
                                <option value="Pro Business" selected>Plano Pro Business - R$ 49,90/ano</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-app-primary btn-full">
                        Criar Meu Card Agora
                    </button>

                </form>

                <div class="auth-footer text-center">
                    <p>Já possui um cartão cadastrado? <a href="login.html" class="link-highlight">Fazer Login</a></p>
                </div>
            </div>
        </div>
    </main>

    <div class="mobile-bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Início</span>
        </a>
        <a href="planos.html" class="nav-item">
            <span class="nav-icon">💎</span>
            <span class="nav-label">Planos</span>
        </a>
        <a href="cadastro.html" class="nav-item active">
            <span class="nav-icon">➕</span>
            <span class="nav-label">Criar</span>
        </a>
        <a href="login.html" class="nav-item">
            <span class="nav-icon">🔑</span>
            <span class="nav-label">Entrar</span>
        </a>
    </div>

    <script src="app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
