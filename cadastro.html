<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | EBC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a href="index.html" class="logo"><span class="highlight">EBC</span></a>
        <h2>Criar sua conta no EBC</h2>
        <p>Insira seus dados para gerar seu cartão digital único.</p>

        <form id="form-cadastro">
            <input type="text" id="nome" placeholder="Seu Nome Completo" required>
            <input type="email" id="email" placeholder="Seu E-mail" required>
            <input type="tel" id="whatsapp" placeholder="Seu WhatsApp (ex: 42999157587)" required>
            <input type="password" id="senha" placeholder="Sua Senha" required>
            
            <button type="submit" class="btn btn-primary btn-full">Cadastrar e Gerar Card</button>
        </form>

        <p class="auth-footer">Já tem uma conta? <a href="login.html">Fazer Login</a></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
